<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="uclaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2774AE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E5A8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="uclaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD100;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB81C;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#uclaBlue)" filter="url(#shadow)" />
  
  <!-- Inner Design - K Letter -->
  <path d="M60 40 L60 160 L80 160 L80 115 L120 160 L145 160 L100 110 L145 40 L120 40 L80 85 L80 40 Z" 
        fill="url(#uclaGold)" stroke="#FFFFFF" stroke-width="2" />
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#uclaGold)" stroke-width="2" opacity="0.5" />
  <circle cx="100" cy="100" r="65" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3" />
  
  <!-- Framework Icon - Brackets -->
  <path d="M50 70 L50 130 L55 130 L55 75 L145 75 L145 130 L150 130 L150 70 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8" />
  
  <!-- UCLA Reference - Small Badge -->
  <circle cx="145" cy="55" r="18" fill="url(#uclaGold)" />
  <text x="145" y="60" font-family="Arial, sans-serif" font-size="10" font-weight="bold" 
        fill="#2774AE" text-anchor="middle">UCLA</text>
</svg>
